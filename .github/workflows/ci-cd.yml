
name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

permissions:
  contents: read

# =========================================================
# JOB 1: TEST ALL
# Chạy trên cả Pull Request và Push vào main
# =========================================================
jobs:

  test-all:
    name: "1. Test Backend, Database & Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      GEMINI_API_KEY: test-key-for-unit-tests

    services:
      postgres-test:
        image: postgres:15

        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # ---------------------------------------------------
      # 1. CHECKOUT SOURCE CODE
      # ---------------------------------------------------
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 2. DEBUG WORKFLOW EVENT
      # ---------------------------------------------------
      - name: Display Workflow Information
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BRANCH: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Event: $EVENT_NAME"
          echo "Ref: $REF"
          echo "Branch: $BRANCH"
          echo "Base Ref: $BASE_REF"
          echo "Head Ref: $HEAD_REF"
          echo "======================================"

      # ---------------------------------------------------
      # 3. CHECK UNRESOLVED MERGE CONFLICTS
      # ---------------------------------------------------
      - name: Check Unresolved Merge Conflicts
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking unresolved merge conflicts..."

          # Check unmerged Git files
          if git ls-files -u | grep -q .; then
            echo "::error::Unmerged files detected!"
            exit 1
          fi

          # Check conflict markers in source files
          if git grep -n -I -E \
            '^(<<<<<<< |=======$|>>>>>>> )' \
            -- backend frontend database Dockerfile; then

            echo "::error::Merge conflict markers detected!"
            exit 1
          fi

          echo "No unresolved merge conflicts detected."

      # ---------------------------------------------------
      # 4. SETUP POSTGRESQL CLIENT
      # ---------------------------------------------------
      - name: Install PostgreSQL Client
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # ---------------------------------------------------
      # 5. WAIT FOR POSTGRESQL
      # ---------------------------------------------------
      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..30}; do

            if pg_isready \
              -h localhost \
              -p 5432 \
              -U test_user \
              -d test_db; then

              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "::error::PostgreSQL did not become ready."
          exit 1

      # ---------------------------------------------------
      # 6. VALIDATE DATABASE SCHEMA
      # ---------------------------------------------------
      - name: Validate Database Schema
        shell: bash
        env:
          PGPASSWORD: test_password
        run: |
          set -euo pipefail

          test -f database/schema.sql

          echo "Validating database/schema.sql..."

          psql \
            -v ON_ERROR_STOP=1 \
            -h localhost \
            -U test_user \
            -d test_db \
            -f database/schema.sql

          echo "Database schema validation passed."

      # ---------------------------------------------------
      # 7. CHECK SUPABASE CONNECTION
      # Only execute on push to main
      # ---------------------------------------------------
      - name: Test Connection to Supabase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_DATABASE_URL" ]; then
            echo "::error::Missing DATABASE_URL secret!"
            exit 1
          fi

          echo "Checking Supabase connection..."

          PGCONNECT_TIMEOUT=10 psql \
            "$SUPABASE_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT 1;"

          echo "Supabase connection passed."

      # ---------------------------------------------------
      # 8. SETUP PYTHON
      # ---------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # ---------------------------------------------------
      # 9. INSTALL BACKEND DEPENDENCIES
      # ---------------------------------------------------
      - name: Install Backend Dependencies
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail

          test -f requirements.txt

          python -m pip install --upgrade pip

          pip install -r requirements.txt
          pip install pytest

      # ---------------------------------------------------
      # 10. BACKEND UNIT TESTS
      # ---------------------------------------------------
      - name: Run Backend Unit Tests
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail

          test -d tests

          echo "Running backend unit tests..."

          pytest tests/ -v

          echo "Backend tests passed."

      # ---------------------------------------------------
      # 11. SETUP NODE.JS
      # ---------------------------------------------------
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ---------------------------------------------------
      # 12. INSTALL FRONTEND DEPENDENCIES
      # ---------------------------------------------------
      - name: Install Frontend Dependencies
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail

          test -f package.json
          test -f package-lock.json

          npm ci

      # ---------------------------------------------------
      # 13. BUILD FRONTEND
      # ---------------------------------------------------
      - name: Build Frontend
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail

          npm run build

          echo "Frontend build passed."


  # =========================================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGE
  # Only run after Job 1 succeeds
  # Only execute on push to main
  # =========================================================

  build-and-push:
    name: "2. Build & Push Docker Image"

    needs: test-all

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test-all.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ---------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 2. SETUP DOCKER BUILDX
      # ---------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------
      # 3. VALIDATE DOCKER SECRETS
      # ---------------------------------------------------
      - name: Validate Docker Hub Secrets
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$DOCKER_USERNAME"
          test -n "$DOCKER_PASSWORD"

          echo "Docker Hub credentials are configured."

      # ---------------------------------------------------
      # 4. LOGIN DOCKER HUB
      # ---------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------------------------------------------
      # 5. BUILD AND PUSH IMAGE
      # ---------------------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            duongntoichoi/final_project:latest
            duongntoichoi/final_project:${{ github.sha }}


  # =========================================================
  # JOB 3: DEPLOY FRONTEND TO VERCEL
  # Only run after Job 2 succeeds
  # Only execute on push to main
  # =========================================================

  deploy-frontend:
    name: "3. Deploy Frontend to Vercel"

    needs: build-and-push

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build-and-push.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ---------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 2. SETUP NODE.JS
      # ---------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ---------------------------------------------------
      # 3. INSTALL FRONTEND DEPENDENCIES
      # ---------------------------------------------------
      - name: Install Frontend Dependencies
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail

          npm ci

      # ---------------------------------------------------
      # 4. CHECK FRONTEND
      # ---------------------------------------------------
      - name: Check Frontend
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail

          npm ls vite

          ./node_modules/.bin/vite --version

      # ---------------------------------------------------
      # 5. VALIDATE VERCEL SECRETS
      # ---------------------------------------------------
      - name: Validate Vercel Secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

          echo "Vercel credentials are configured."

      # ---------------------------------------------------
      # 6. INSTALL VERCEL CLI
      # ---------------------------------------------------
      - name: Install Vercel CLI
        shell: bash
        run: |
          set -euo pipefail

          npm install --global vercel@latest

      # ---------------------------------------------------
      # 7. PULL VERCEL ENVIRONMENT
      # ---------------------------------------------------
      - name: Pull Vercel Environment Information
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          vercel pull \
            --environment=production \
            --yes \
            --token="$VERCEL_TOKEN"

      # ---------------------------------------------------
      # 8. BUILD PRODUCTION
      # ---------------------------------------------------
      - name: Build Project with Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

      # ---------------------------------------------------
      # 9. DEPLOY PRODUCTION
      # ---------------------------------------------------
      - name: Deploy Project to Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          vercel deploy \
            --prod \
            --prebuilt \
            --token="$VERCEL_TOKEN"

          echo "Frontend deployment completed successfully."


name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =====================================================
  # JOB 1: TEST ALL
  # Chạy khi tạo/cập nhật PR và khi push vào main
  # =====================================================
  test-all:
    name: "1. Test Backend, Database & Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      GEMINI_API_KEY: test-key-for-unit-tests

    services:
      postgres-test:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 1. CHECK MERGE CONFLICT
      # -------------------------------------------------
      - name: Check Unresolved Merge Conflicts
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking merge conflicts..."

          if git ls-files -u | grep -q .; then
            echo "::error::Unmerged files detected!"
            exit 1
          fi

          if git grep -n -I -E \
            '^(<<<<<<< |=======$|>>>>>>> )' \
            -- .github backend frontend database Dockerfile docker-compose.yml; then

            echo "::error::Conflict markers detected!"
            exit 1
          else
            grep_status=$?

            if [ "$grep_status" -ne 1 ]; then
              echo "::error::Unable to complete conflict scan."
              exit "$grep_status"
            fi
          fi

          echo "No merge conflict markers detected."

      # -------------------------------------------------
      # 2. DATABASE TEST
      # -------------------------------------------------
      - name: Install PostgreSQL Client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if pg_isready \
              -h localhost \
              -p 5432 \
              -U test_user \
              -d test_db; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "::error::PostgreSQL connection timeout."
          exit 1

      - name: Validate Database Schema
        shell: bash
        env:
          PGPASSWORD: test_password
        run: |
          set -euo pipefail

          test -f database/schema.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -h localhost \
            -U test_user \
            -d test_db \
            -f database/schema.sql

          echo "Database schema validation passed."

      # -------------------------------------------------
      # 3. PRODUCTION DATABASE CHECK
      # -------------------------------------------------
      - name: Test Supabase Connection
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          test -n "$SUPABASE_DATABASE_URL"

          PGCONNECT_TIMEOUT=10 psql \
            "$SUPABASE_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT 1;"

          echo "Supabase connection passed."

      # -------------------------------------------------
      # 4. BACKEND UNIT TESTS
      # -------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          test -f requirements.txt

          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Backend Unit Tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          test -d tests

          pytest tests/ -v

          echo "Backend tests passed."

      # -------------------------------------------------
      # 5. FRONTEND BUILD TEST
      # -------------------------------------------------
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f package-lock.json

          npm ci

      - name: Build Frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          npm run build

          echo "Frontend build passed."


  # =====================================================
  # JOB 2: BUILD & PUSH DOCKER IMAGE
  # Chỉ chạy khi JOB 1 thành công và push vào main
  # =====================================================
  build-and-push:
    name: "2. Build & Push Docker Image"

    needs: test-all

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub Secrets
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$DOCKER_USERNAME"
          test -n "$DOCKER_PASSWORD"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            duongntoichoi/final_project:latest
            duongntoichoi/final_project:${{ github.sha }}


  # =====================================================
  # JOB 3: DEPLOY FRONTEND TO VERCEL
  # Chỉ chạy khi JOB 2 thành công
  # =====================================================
  deploy-frontend:
    name: "3. Deploy Frontend to Vercel"

    needs: build-and-push

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Check Frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          npm ls vite
          ./node_modules/.bin/vite --version

      - name: Validate Vercel Secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Install Vercel CLI
        run: |
          set -euo pipefail
          npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          vercel pull \
            --environment=production \
            --yes \
            --token="$VERCEL_TOKEN"

      - name: Build Project with Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

      - name: Deploy Project to Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          vercel deploy \
            --prod \
            --prebuilt \
            --token="$VERCEL_TOKEN"

          echo "Frontend deployment completed successfully."

deploy:
    runs-on: ubuntu-latest
    needs: [test-all]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build Vite App
        working-directory: ${{ github.workspace }}/frontend
        run: |
          npm install
          npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create Local Vercel Project Config
        working-directory: ${{ github.workspace }}/frontend
        run: |
          mkdir -p .vercel
          echo '{"projectId": "${{ secrets.VERCEL_PROJECT_ID }}", "orgId": "${{ secrets.VERCEL_ORG_ID }}", "settings": {"rootDirectory": ""}}' > .vercel/project.json
          echo "--> Đã tạo sẵn project.json với rootDirectory trống để chặn Vercel ghi đè!"

      - name: Pull Vercel Environment Information
        working-directory: ${{ github.workspace }}/frontend
        run: vercel pull --environment=production --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project to Vercel
        working-directory: ${{ github.workspace }}/frontend
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}